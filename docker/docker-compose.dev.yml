# 开发模式配置 - 挂载本地源码
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d

services:
  backend:
    volumes:
      # 挂载后端源码（只挂载 bisheng 和 bisheng_langchain 目录）
      - ../src/backend/bisheng:/app/bisheng:ro
      - ../src/backend/bisheng_langchain:/app/bisheng_langchain:ro
    environment:
      - PYTHONPATH=/app
      # 开发模式启用调试
      - DEBUG=1
    command: sh -c "uvicorn bisheng.main:app --host 0.0.0.0 --port 7860 --reload --workers 1"

  backend_worker:
    volumes:
      # 挂载后端源码
      - ../src/backend/bisheng:/app/bisheng:ro
      - ../src/backend/bisheng_langchain:/app/bisheng_langchain:ro
    environment:
      - PYTHONPATH=/app
      - DEBUG=1